<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0">
<title>WardFlow 아키텍처</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 16:9 한 장. 왼쪽 도식(그룹 경계 + 아이콘 상자 + 번호 원), 오른쪽 번호 범례, 아래 핵심 설계 한 줄.
   상자에는 이름과 기술만, 설명은 모두 범례로 보낸다 (엔터프라이즈 참조 아키텍처 방식) */
:root{
  --bg:#eef1f4; --slide:#ffffff; --ink:#1b2430; --muted:#5f6b78; --line:#cdd5dd; --box:#ffffff;
  --group:#f4f6f8; --zone:#8d99a6; --icon:#4a5664;
  --accent:#2f6fde; --accent-tint:#ecf2fd; --accent-ink:#1f4fae;
  --llm:#b06a10; --llm-tint:#fdf4e6;
  --badge:#1b2430; --badge-fg:#ffffff;
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1016; --slide:#141c25; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2f3b49; --box:#18212b;
  --group:#111922; --zone:#5f6d7c; --icon:#b3bfcb;
  --accent:#6b9cf0; --accent-tint:#18263b; --accent-ink:#9dbcf5;
  --llm:#e0a24a; --llm-tint:#2b2215; --badge:#e7ecf1; --badge-fg:#0f151c; color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0b1016; --slide:#141c25; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2f3b49; --box:#18212b;
  --group:#111922; --zone:#5f6d7c; --icon:#b3bfcb;
  --accent:#6b9cf0; --accent-tint:#18263b; --accent-ink:#9dbcf5;
  --llm:#e0a24a; --llm-tint:#2b2215; --badge:#e7ecf1; --badge-fg:#0f151c; color-scheme:dark; }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-sans); }
.wrap{ padding-block:24px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.slide{ max-width:1280px; margin:0 auto; background:var(--slide); border-radius:10px; overflow:hidden; box-shadow:0 2px 14px rgba(20,30,40,.08); }
svg{ display:block; width:100%; height:auto; font-family:var(--f-sans); }

.t-h{ font-size:30px; font-weight:700; fill:var(--ink); }
.t-sub{ font-size:15px; fill:var(--muted); }

.zone{ fill:none; stroke:var(--zone); stroke-width:1.4; stroke-dasharray:7 5; }
.grp{ fill:var(--group); stroke:var(--line); stroke-width:1.2; }
.tab{ fill:var(--slide); }
.gl{ font-size:13px; font-weight:700; fill:var(--muted); letter-spacing:.02em; }

.bx{ fill:var(--box); stroke:var(--line); stroke-width:1.3; }
.bx-llm{ fill:var(--llm-tint); stroke:var(--llm); stroke-width:1.5; stroke-dasharray:6 4; }
.core{ fill:var(--accent-tint); stroke:var(--accent); stroke-width:2; }
.row{ fill:var(--box); stroke:var(--line); stroke-width:1; }
.row-gate{ fill:var(--accent); }
.nm{ font-size:15.5px; font-weight:700; fill:var(--ink); }
.tc{ font-size:12px; font-weight:500; fill:var(--muted); }
.core-h{ font-size:16px; font-weight:700; fill:var(--accent-ink); }
.row-t{ font-size:14px; font-weight:600; fill:var(--ink); }
.row-gt{ font-size:14px; font-weight:700; fill:#ffffff; }
.ic{ color:var(--icon); }
.ic-llm{ color:var(--llm); }
.ic-acc{ color:var(--accent); }

.ar{ stroke:var(--muted); stroke-width:1.6; fill:none; }
.ar-llm{ stroke:var(--llm); stroke-width:1.6; fill:none; stroke-dasharray:5 4; }
.mh{ fill:var(--muted); } .mh-llm{ fill:var(--llm); }

.bd{ fill:var(--badge); stroke:var(--slide); stroke-width:2.5; }
.bn{ font-size:12px; font-weight:700; fill:var(--badge-fg); }

.lg-h{ font-size:15px; font-weight:700; fill:var(--ink); }
.lg{ font-size:13.5px; fill:var(--ink); }
.lg-m{ font-size:13.5px; fill:var(--muted); }
.div{ stroke:var(--line); stroke-width:1; }

.key-h{ font-size:14px; font-weight:700; fill:var(--accent); }
.key{ font-size:14px; fill:var(--ink); }
</style>

<div class="wrap">
