# 운영 달력과 역할 매핑 (SAG-8, LP-25). 값은 합성 병원용 설계 가정이다.
calendar:
  # 병원 휴무일 목록. 합성 병원은 비워 둔다(설계 가정: 합성 기간을 평일로 본다). 실제 병원은 휴무일을 넣는다
  holidays: []
  nursing_shifts:            # 간호 3교대 시작 시각 (흔한 병동 운영, 설계 가정)
    day: "07:00"
    evening: "15:00"
    night: "23:00"
  office_hours: ["09:00", "18:00"]   # 평일 입원 창구 운영 (서울대병원 안내 09–18시, LP-25)
roles:                       # 논리 역할 → 시간대별 실제 담당
  bed_manager: {office: admission_office, off_hours: night_admin}   # 야간·휴일 당직 원무 (설계 가정)
  ipc: {office: ipc, off_hours: id_oncall}                          # 야간 감염내과 당직 (MA-01)
  ward: {shift: charge_nurse}                                        # 근무조 책임간호사
  environment_vendor: {office: environment_vendor, off_hours: environment_vendor}
escalation:                  # 마감 초과 시 상위 담당 (설계 가정)
  ward: nursing_supervisor
  bed_manager: admission_lead
  ipc: ipc_lead
  environment_vendor: environment_lead
task_sla_min:                # 작업 종류별 마감 (분). payload의 due가 있으면 그 값이 우선
  review: 60                 # 담당 검토 큐 (CASE_ROUTED_REVIEW)
  rx_missing: 30
  negative_pressure_failure: 15
  pinned_placement_review: 60
  confirm_correction: 60
  data_fix: 60
  fee_consent: 120
  reapproval: 30
  missing_cleaning_done: 30
  recontact: 30
  cancel_after_departure: 60
  default: 120
