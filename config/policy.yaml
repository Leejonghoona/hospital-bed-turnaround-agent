# 실행 게이트웨이 정책 파일 (설계의 OPA 정책 엔진 대신 YAML). 값은 합성 데이터용 설계값이다.
version: policy-2026-11-08
autonomy_stage: 1            # 1 HITL, 2 예외 관리, 3 HOTL
promoted_departments: []     # 2단계 이상에서 담당 확인 없이 병동에 문의할 유형 (진료과 기준)
pediatric_age: 15            # 이 나이 미만은 소아로 담당 검토
score_gap_min: 5.0           # 1·2순위 점수 차가 이보다 작으면 담당 검토
review_reasons:              # 하나라도 해당하면 담당 검토
  - isolation                # 격리 오더 (전파경로 주의)
  - preemptive_isolation     # 선제 격리
  - pediatric
  - icu_stepdown
  - single_room_preference   # 1인실 희망 (차액 동의)
  - same_name_same_ward      # 같은 병동 동명이인 (LP-02)
  - no_bed
  - close_scores
  - integrated_care_consent_missing
  - missing_input            # 성별·진료과 누락
  - isolation_discharge_bed  # 격리 퇴실 병실에 매칭
auto_actions: [share_waiting_info, recompute_ready_time, cleaning_schedule_update, send_cleaning_request]
query_fields:                # 역할별로 답할 수 있는 필드
  environment_vendor: [bed_id, eta, cleaning_type]
  bed_manager: [bed_id, eta, cleaning_type, name, department, precautions, reason]
manual_override:
  roles: [bed_manager]
  reason_codes: [vip, patient_request, clinical, operational, other]
  safety_exception_roles: [ipc, id_oncall]   # 감염관리실, 야간·휴일은 감염내과 당직이 대행 (id_oncall은 MVP 가정)
  safety_tiers:              # GW-10 안전 예외 3단계 (LP-24, 표준예방지침 2017 근거)
    tb_shared_room: forbidden              # 5.5.2.4 결핵 방 공유 금지
    same_name_room: forbidden              # 환자 확인 오류 (설계 가정)
    gender_missing: forbidden              # 입력 누락은 예외 대상 아님
    unknown_bed: forbidden
    airborne_needs_negative_pressure: preapproval  # 5.5.2.6 감염관리 전문가와 상의
    non_cohort_in_cohort_room: preapproval
    protective_in_cohort: preapproval      # 5.3.2.3 코호트 고위험 금지
    preemptive_in_cohort: preapproval
    isolation_room: reason_entry           # 5.3.2.4 / 5.4.2.5 커튼과 1m 차선책 + 사후 검토
    gender_room: forbidden                 # 의료법 시행규칙 제35조의2제2호 "입원실은 남ㆍ여별로 구별하여 운영할 것" (예외 단서는 공포 뒤 반영)
  preapproval_organisms:
    isolation_room: [CRE, CPE]             # 5.2.1 CRE 1인실 우선, 감염관리실무자 결정
ventilation:                 # 비말·공기주의 퇴실 환기 대기 (LP-23). 병실 공기순환 횟수로 지침 부록 3 표에서 찾는다
  removal_pct: 99.9
  hospital_wait_min: null    # 병원 규칙으로 덮어쓸 때만 분 단위로 넣는다. 지침 값과 다르면 "지침 대비" 표시 (POL-2)
external_llm: deny
admission_priority: [icu_stepdown]   # 목표 함수 3항 임상 우선순위(처리 순서만). 응급실 경유는 설문 뒤 추가
scoring:                     # 에이전트 목표 함수 4~5항 가중치 (SPEC 3절, 설계 가정)
  department_ward_match: 30.0       # 진료과 병동 일치
  negative_pressure_preserve: -40.0 # 공기주의가 아닌 환자의 음압실 사용 감점 (LP-18)
  single_room_requested: 20.0       # 1인실 희망 환자의 1인실
  single_room_unrequested: -15.0    # 사유 없는 1인실 사용 감점 (1인실 보존)
  near_nurse_station_high_risk: 10.0
  ward_load_per_pending: -3.0       # 병동에 진행 중 제안 1건당
  ready_delay_per_10min: -1.0       # 준비까지 10분당
  rematch_gain_min: 3.0             # 재매칭 최소 이득 (6항 변동 최소). 준비 30분 단축에 해당
extraction:                  # 메모 추출 스키마 (U3 상대 날짜, U5 메모 주체 결정. U1 필드·U2 코드는 현직자 설문 뒤 확정)
  delay_codes: [guardian, billing, medication, transport]   # 보류: 설계 문서 6개 + 기타 안과 비교 중 (U2)
  fields_by_case:
    discharge: [guardian_eta, guardian_eta_day, delay_reason, mobility_aid]
    admission: [single_room_wish]   # 1인실 희망은 입원 대기 환자의 정보 (검수 결과)
  max_day_offset: 7
hospital_profile:            # 병원 프로필 (설계 개정 6절). 기본값은 지금 동작, 현장값은 config/profiles/field_default.yaml
  id: legacy
exception_actions:           # 예외(사가 감지) → 머리가 고를 수 있는 행동 (설계 개정 4.2). 안전을 푸는 행동은 넣지 않는다
  late_isolation:
    allowed: [rematch_now, wait_for_ipc, escalate, propose_surveillance_hold]
    fallback: escalate
autonomy:                    # 행동별 자율 단계 auto | post_report | human. 환자 연락·안전 예외 승인은 코드로 human 고정
  contact_patient: human
  official_commit: human     # legacy. auto면 검토 사유 없는 사례를 에이전트가 확정하고 병동·원무에 통보 (DECISIONS 2026-11-09)
  approve_safety_exception: human
  escalate: auto             # 올리는 것 자체는 자동 (사람이 받는다)
  rematch_now: auto          # 제안만 자동. 확정은 기존 확인 등급
  wait_for_ipc: post_report
  propose_surveillance_hold: human   # 감염관리실 승인
brain:
  enabled: false             # 예외 판단 머리. false면 지금 동작(사람에게 올림)
provenance:                  # POL-1 규칙 값마다 출처 등급과 근거. law > guideline > hospital_rule > field_practice > design_assumption
  admission_priority: {tier: design_assumption, cite: "SPEC 3절 3항. 중환자실 하향 우선은 설계 문서 검토 표의 우선순위 상위. 병원 규칙으로 바꾼다"}
  hospital_profile.assignment: {tier: field_practice, cite: "공개 병원 안내 14곳 당일 오전 배정(docs/검토/현장조사/원무_병상배정_실무.md). 기본값 전환은 S8"}
  hospital_profile.ward_confirmation: {tier: field_practice, cite: "서울고법 2013누25193(원무 배정·병동 이의), 간호사 블로그·영상. 이의 기간은 설계 가정"}
  hospital_profile.cleaning: {tier: hospital_rule, cite: "해운대백 과업지시서 13:30 침상 정리, 동아대 감염관리실 영상(미화 표면). 다인실 침상 단위는 설계 가정"}
  hospital_profile.discharge_sequence: {tier: hospital_rule, cite: "아산 퇴원 절차(심사→연락→수납→약), 인천성모 QI 단계 소요, 퇴실 11시 규정 병원 안내"}
  exception_actions: {tier: design_assumption, cite: "설계 개정 4.2 예외 목록. 1차는 E1(늦은 격리 정보)만"}
  autonomy: {tier: design_assumption, cite: "DECISIONS U8 확장: 되돌릴 수 있는 행동만 자동, 책임 순간은 사람(코드 고정)"}
  autonomy_stage: {tier: design_assumption, cite: "설계 문서 자율화 단계. 1단계 HITL로 시작"}
  promoted_departments: {tier: design_assumption, cite: "자율화 2단계 승격은 운영 지표로 정한다"}
  pediatric_age: {tier: design_assumption, cite: "소아 기준 연령은 병원마다 다르다. 근거 미확인, 병원 규칙으로 바꾼다"}
  score_gap_min: {tier: design_assumption, cite: "1·2순위 점수 차 임계값. 재생 평가로 조정"}
  review_reasons: {tier: design_assumption, cite: "LP-21 담당 검토 사유. 현직자 확인 목록(SPEC 1.5절)"}
  auto_actions: {tier: design_assumption, cite: "되돌릴 수 있는 행동만 자동 실행 (설계 원칙)"}
  query_fields: {tier: hospital_rule, cite: "개인정보 최소 제공. 청소 협력업체는 병상·시각·청소 유형만"}
  manual_override.roles: {tier: hospital_rule, cite: "병상 배정 권한은 병원 직제에 따름 (합성 병원 가정)"}
  manual_override.safety_exception_roles: {tier: guideline, cite: "표준예방지침 5.5.2.6 감염관리 전문가와 상의. 야간 대행 id_oncall은 설계 가정(MA-01)"}
  manual_override.safety_tiers: {tier: guideline, cite: "표준예방지침 5.5.2.4, 5.5.2.6, 부록1 A 5.2.1, 5.3.2.3, 5.3.2.4, 5.4.2.5 (LP-24)"}
  manual_override.safety_tiers.gender_room: {tier: law, cite: "의료법 시행규칙 제35조의2제2호(보건복지부령 제1177호, 2026.6.12 시행) 입원실 남녀 구별. 위반 시 시정명령, 불이행 시 업무정지 15일(의료관계 행정처분 규칙 별표). 중환자실·가족 2인실 예외는 단서 공포 뒤 반영"}
  ventilation: {tier: guideline, cite: "표준예방지침 제5장 부록 3 공기순환 횟수별 제거 시간, 99.9% 열. 병실 순환 횟수 기본값(음압 12, 일반 4)은 설계 가정"}
  scoring: {tier: design_assumption, cite: "SPEC 3절 목표 함수 가중치. 규칙 모드와 에이전트를 같은 목표로 비교"}
  extraction: {tier: design_assumption, cite: "필드·코드는 현직자 설문(docs/검토/현직자_설문_문구.json) 뒤 확정. 상대 날짜·메모 주체는 라벨 절차 검수 합의"}
  external_llm: {tier: hospital_rule, cite: "환자정보 국외 이전 금지 운영 원칙 (설계 문서 보안 절)"}
