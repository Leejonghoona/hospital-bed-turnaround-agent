# 실행 게이트웨이 정책 파일 (설계의 OPA 정책 엔진 대신 YAML). 값은 합성 데이터용 설계값이다.
version: policy-2026-11-08
autonomy_stage: 1            # 1 HITL, 2 예외 관리, 3 HOTL
promoted_departments: []     # 2단계 이상에서 담당 확인 없이 병동에 문의할 유형 (진료과 기준)
pediatric_age: 15            # 이 나이 미만은 소아로 담당 검토
score_gap_min: 5.0           # 1·2순위 점수 차가 이보다 작으면 담당 검토
review_reasons:              # 하나라도 해당하면 담당 검토
  - isolation                # 격리 오더 (전파경로 주의)
  - preemptive_isolation     # 선제 격리
  - pediatric
  - icu_stepdown
  - single_room_preference   # 1인실 희망 (차액 동의)
  - same_name_same_ward      # 같은 병동 동명이인 (LP-02)
  - no_bed
  - close_scores
  - integrated_care_consent_missing
  - missing_input            # 성별·진료과 누락
  - isolation_discharge_bed  # 격리 퇴실 병실에 매칭
auto_actions: [share_waiting_info, recompute_ready_time, cleaning_schedule_update, send_cleaning_request]
query_fields:                # 역할별로 답할 수 있는 필드
  environment_vendor: [bed_id, eta, cleaning_type]
  bed_manager: [bed_id, eta, cleaning_type, name, department, precautions, reason]
manual_override:
  roles: [bed_manager]
  reason_codes: [vip, patient_request, clinical, operational, other]
  safety_exception_roles: [ipc, id_oncall]   # 감염관리실, 야간·휴일은 감염내과 당직이 대행 (id_oncall은 MVP 가정)
  safety_tiers:              # GW-10 안전 예외 3단계 (LP-24, 표준예방지침 2017 근거)
    tb_shared_room: forbidden              # 5.5.2.4 결핵 방 공유 금지
    same_name_room: forbidden              # 환자 확인 오류 (설계 가정)
    gender_missing: forbidden              # 입력 누락은 예외 대상 아님
    unknown_bed: forbidden
    airborne_needs_negative_pressure: preapproval  # 5.5.2.6 감염관리 전문가와 상의
    non_cohort_in_cohort_room: preapproval
    protective_in_cohort: preapproval      # 5.3.2.3 코호트 고위험 금지
    preemptive_in_cohort: preapproval
    isolation_room: reason_entry           # 5.3.2.4 / 5.4.2.5 커튼과 1m 차선책 + 사후 검토
    gender_room: reason_entry
  preapproval_organisms:
    isolation_room: [CRE, CPE]             # 5.2.1 CRE 1인실 우선, 감염관리실무자 결정
aerosol_wait_min: 30         # 비말·공기주의 퇴실 환기 대기 (LP-20, 설계 가정)
external_llm: deny
