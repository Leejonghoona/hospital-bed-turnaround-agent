id: C01
category: saga
title: 강제 종료 후 재개
tags:
- restart
design_ref: 'PoC 10:40 장면: 서버 강제 종료 후 재시작, 사례 워크플로가 진행 중이던 6건을 이어서 실행'
situation: 당일 퇴원 6건(D1~D6)이 서로 다른 단계에 있을 때 프로세스를 강제 종료하고 재시작한다.
fixture:
  seed: 42
  events: 2단계 이벤트 형식 확정 후 작성
gold:
  must_actions:
  - type: resume_case
    case: D1
  - type: resume_case
    case: D2
  - type: resume_case
    case: D3
  - type: resume_case
    case: D4
  - type: resume_case
    case: D5
  - type: resume_case
    case: D6
  must_not:
  - type: execute_side_effect
    params:
      count_over: 1
    note: 재개 후 청소 요청이나 병동 문의 중복
  final_state:
    rule: 무중단 실행과 같은 최종 상태
metrics:
- D1
- D2
measured_from_stage: 3
status: draft
provenance:
  author: claude-draft
