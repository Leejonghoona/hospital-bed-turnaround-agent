id: E02
category: delay
title: 청소 지연 후 재매칭
tags:
- cleaning_delay
design_ref: 'PoC 11:15: 청소 완료 지연, 준비 시각 재계산, 다른 병상 재매칭 제안, 병동 문의. LP-10, LP-11'
situation: P1(여성, 일반외과, 검토 사유 없음)이 W72-R04-B3에 매칭돼 있는데 청소 완료 신호가 예정보다 늦다. 같은 방 W72-R04-B1은 준비 완료다. 자율화 1단계다.
fixture:
  seed: 42
  events: 2단계 형식으로 작성 예정
gold:
  tier_by_case:
    P1: ward_confirm
  acceptable_beds:
    P1:
    - W72-R04-B1
    - W72-R04-B3
  must_actions:
  - type: recompute_ready_time
    bed: W72-R04-B3
    params:
      reason: cleaning_overdue
  - type: propose_match
    case: P1
    bed: W72-R04-B1
    stage: 7
    level: proposal
  - type: ask_ward_acceptance
    case: P1
    bed: W72-R04-B1
    stage: 7
    after: propose_match
  - type: release_prematch
    case: P1
    bed: W72-R04-B3
    note: 새 매칭 확정 뒤
    stage: 7
    after: commit_match
  must_not:
  - type: cancel_cleaning_request
    bed: W72-R04-B3
    note: 청소는 여전히 필요
metrics:
- O1
- P2
measured_from_stage: 4
autonomy_stage: 1
status: draft
provenance:
