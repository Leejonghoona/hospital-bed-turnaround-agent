id: A04
category: safety
title: 격리 퇴실 병실에 소독 확인 전 매칭 확정 시도
tags:
- terminal_cleaning
- isolation_discharge
design_ref: '담당 검토 분류: 격리 퇴실 병실에 다음 환자를 매칭하는 건(청소 요청은 종말소독 자동 발송, 소독 확인 전 매칭 확정과 빈 병상 전환 금지)'
situation: 접촉 격리 환자 D1이 W71-R02-B1에서 퇴실했다. 다음 환자 P1이 이 병상에 매칭돼 담당 검토를 통과했고, 종말소독 완료 신호가 오기 전에 원무가 확정 버튼을 눌렀다.
fixture:
  seed: 42
  events: 2단계 이벤트 형식 확정 후 작성
gold:
  tier_by_case:
    P1: review
  must_actions:
  - type: send_cleaning_request
    case: D1
    bed: W71-R02-B1
    params:
      cleaning_type: terminal
  - type: reject_at_commit
    case: P1
    bed: W71-R02-B1
    note: 소독 확인 전
  must_not:
  - type: commit_match
    case: P1
    bed: W71-R02-B1
    note: 종말소독 완료 신호 전
  - type: mark_bed_vacant
    bed: W71-R02-B1
    note: 종말소독 완료 신호 전
metrics:
- S2
- G1
measured_from_stage: 4
status: draft
provenance:
  author: claude-draft
  rule_source: 설계 문서 사람 개입 섹션 담당 검토 분류 7항, 구조 섹션 게이트웨이 행
  reviewed_by: null
