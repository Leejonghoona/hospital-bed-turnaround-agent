- assignment_rule
design_ref: '데이터 규칙표: 격리 오더 환자는 음압실 또는 1인실(SHACL 위반). 개념 계층: 공기감염 격리 필요 → 음압격리실만'
situation: 입원 대기 P1은 주치의 공기감염 격리 오더가 있다. 빈 병상은 W71-R03-B2(남성 다인실), W71-R02-B1(1인실), W71-R01-B1(음압격리실).
